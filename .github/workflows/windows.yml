name: Windows validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Editor, preview, GFM and export tests
        run: npm test
      - name: Type checking
        run: npm run typecheck
      - name: Launcher tests
        run: npm test --prefix launcher
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
