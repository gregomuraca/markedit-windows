[package]
name = "markedit-rust"
version = "0.3.3"
description = "MarkEdit for Windows — Rust desktop backend"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", features = ["common-controls-v6"] }
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
percent-encoding = "2"
url = "2"
open = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
