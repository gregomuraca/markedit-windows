<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'; form-action 'none'"><title>MarkEdit for Windows</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><img class="app-icon" src="icon.png" alt=""><strong>MarkEdit</strong><span class="platform">for Windows</span></div><nav aria-label="File actions"><button data-action="open" title="Open (Ctrl+O)">Open</button><button data-action="save" title="Save (Ctrl+S)">Save</button></nav><div class="views" role="group" aria-label="Layout"><button data-layout="edit" title="Editor only">Write</button><button data-layout="split" aria-pressed="true">Split</button><button data-layout="read" title="Preview only">Read</button></div><button id="theme" title="Switch theme" aria-label="Switch to dark theme">◐</button></header>
<div id="action-notice" hidden><span id="action-error" role="alert"></span><button id="dismiss-error" aria-label="Dismiss error">Dismiss</button></div>
<main id="workspace" data-layout="split">
<section id="write-pane" aria-label="Markdown editor"><div class="pane-label"><span>MARKDOWN</span><span id="save-state" role="status" aria-live="polite">All changes saved</span></div>
<div class="formatbar" role="group" aria-label="Formatting">
<select id="heading" aria-label="Heading" title="Heading level (Ctrl+1–6)"><option value="0" selected>Plain text</option><option value="mixed" disabled>Mixed</option><option value="1">Heading 1</option><option value="2">Heading 2</option><option value="3">Heading 3</option><option value="4">Heading 4</option><option value="5">Heading 5</option><option value="6">Heading 6</option></select>
<span class="separator" aria-hidden="true"></span>
<button data-command="image" title="Insert image" aria-label="Insert image"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg></button><input id="image-file" type="file" accept=".png,.jpg,.jpeg,.gif,.webp,.bmp" hidden>
<button data-command="toggleBold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button><button data-command="toggleItalic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
<button data-command="link" title="Insert link" aria-label="Insert link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13 4-4m-6 6-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 3 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 1)"/></svg></button>
<button data-command="toggleBullet" title="Bullet list" aria-label="Bullet list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
<details id="more-formatting"><summary title="More formatting">More <span aria-hidden="true">⌄</span></summary><div class="format-menu" role="group" aria-label="More formatting">
<button data-command="toggleTodo">Task list</button><button data-command="toggleNumbering">Numbered list</button><button data-command="toggleBlockquote">Blockquote</button><button data-command="table">Table</button><button data-command="toggleStrikethrough">Strikethrough</button><button data-command="toggleInlineCode" title="Inline code (Ctrl+E)">Inline code</button><button data-command="insertCodeBlock">Code block</button><button data-command="insertHorizontalRule">Horizontal rule</button>
</div></details></div>
<div id="search" hidden><div><input id="query" aria-label="Find" placeholder="Find text"><button id="find-prev" title="Previous match">↑</button><button id="find-next" title="Next match">↓</button><button id="close-search" aria-label="Close search">×</button></div><div><input id="replacement" aria-label="Replace with" placeholder="Replace with"><button id="replace-next">Replace</button><button id="replace-all">All</button></div><span id="search-status" role="status"></span></div>
<div id="editor"></div></section>
<div id="divider" role="separator" aria-label="Resize editor and preview" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0"></div>
<section id="read-pane" aria-label="Markdown preview"><div class="pane-label"><span>PREVIEW</span><label><input id="sync" type="checkbox" checked> Sync scroll</label></div><article id="preview"></article></section>
</main><footer><span id="position">Ln 1, Col 1</span><span id="counts">0 words</span><span class="footer-right">UTF-8 <span id="line-ending">LF</span><span id="message" role="status">Local files. Just Markdown.</span></span></footer>
<script type="module" src="renderer.js"></script></body></html>
